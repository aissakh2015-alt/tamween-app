<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- خلفية دائرية -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- السهم الدائري الأخضر -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="150"
            fill="none" stroke="#22c55e" stroke-width="40"
            stroke-linecap="round"
            stroke-dasharray="720 220"
            transform="rotate(-45)"/>
    <polygon points="-15,-170 40,-170 -20,-230" fill="#22c55e"/>
  </g>

  <!-- نص اختياري -->
  <text x="256" y="470"
        text-anchor="middle"
        font-family="Arial" font-size="52" font-weight="bold"
        fill="#22c55e" letter-spacing="4">
    التموين
  </text>
</svg>